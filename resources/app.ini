[app]
Title=Duke Nukem 3D (Shareware)
Author=JFDuke3D by Jonathon Fowler; Duke Nukem 3D by 3D Realms, 1996
Version=20260105-1
Image=icon.png
Readme=readme.txt
# the program for this machine (the launcher's docs/app-format-plan.md): bin/psc/duke3d on the console,
# bin/rpi, bin/rpi64, bin/pcusb on the appliances, bin/win/duke3d.exe on Windows. The launcher starts an App in
# its own folder; user_profiles_disabled there keeps the settings (duke3d.cfg) and the saves in it too. (The
# folder is still called eduke32: the 2020 App it replaces was EDuke32, and the Store updates it in place.)
Exec=bin/{key}/duke3d
# no setup dialogue (it would stop at a window a pad cannot use); full screen at 640x480 is the default, drawn
# 4:3 over the display's full height
Args=-nosetup
# SDL2 is the launcher's (the console) or the system's - nothing of its own; Windows needs no SDL at all
# JFDuke3D reads the pad through SDL's GameController API; the virtual pad shows it an Xbox 360 pad, which
# patches/jfduke3d/0001-psc-pad-layout.patch lays out as the 2020 PlayStation Classic port did
VirtualPad=true
Kernel=false
